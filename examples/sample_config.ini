[anonymizer]
org_name = acme-corp
hash_len = 12
max_token_len = 500
pbkdf2_iterations = 200000
regex_timeout_seconds = 5.0
sensitive_json_keys = user,username,login,account,ip,ipaddress,src_ip,dest_ip,password,secret,token,email,domain,hostname
key_type_hints = ip:IP,email:EMAIL,user:USER,username:USER
well_known_sids = S-1-1-0,S-1-5-18,S-1-5-19,S-1-5-20,S-1-5-32-544
nil_guid = 00000000-0000-0000-0000-000000000000
phone_prefixes = +375,+7,+1,+44
fqdn_tlds = com,net,org,local,internal,corp
cef_fields = src,dst,suser,duser,cs1,cs2,cs3,cs4,shost,dhost
session_timeout_minutes = 15
