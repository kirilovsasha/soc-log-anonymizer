name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners often use cp1252; Cyrillic CLI output needs UTF-8.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PowerShell на windows-latest не раскрывает *.py — компилируем через pathlib.
      - name: Byte-compile all modules
        run: python -c "import pathlib, py_compile; paths=list(pathlib.Path('soc_log_anonymizer').glob('*.py'))+list(pathlib.Path('tests').glob('*.py')); [py_compile.compile(str(p), doraise=True) for p in paths]; print(f'compiled {len(paths)} files')"

      # Тесты сознательно не требуют tkinter: GUI-специфичная логика
      # вынесена в gui_logic.py (без импорта tkinter), а cli.py импортирует
      # gui.py лениво (внутри функции, не на уровне модуля) — поэтому
      # полный набор тестов проходит и на раннерах без установленного Tk.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint and typecheck package
        run: |
          pip install -e ".[dev]"
          ruff check soc_log_anonymizer
          mypy --ignore-missing-imports --follow-imports=skip \
            soc_log_anonymizer/detectors.py \
            soc_log_anonymizer/result.py \
            soc_log_anonymizer/structured.py \
            soc_log_anonymizer/json_stream.py \
            soc_log_anonymizer/parallel_merge.py \
            soc_log_anonymizer/mapping_crypto.py \
            soc_log_anonymizer/gui_theme.py

      - name: Run doctest examples
        run: |
          python -c "
          import doctest, sys
          import soc_log_anonymizer.anonymizer as m
          results = doctest.testmod(m, verbose=False)
          print(results)
          sys.exit(1 if results.failed else 0)
          "

      - name: Validate example configs
        run: |
          python -m soc_log_anonymizer validate-config examples/sample_config.json
          python -m soc_log_anonymizer validate-config examples/sample_config.ini

      - name: --version smoke test
        run: python -m soc_log_anonymizer --version

      - name: CLI smoke test (anonymize + stats + fail-on-unsafe)
        shell: bash
        run: |
          echo "smoke-test-salt-0123456789abcdef" > salt.txt
          python -m soc_log_anonymizer anonymize \
            -i examples/sample.log -o clean.log \
            --org bank --salt-file salt.txt \
            --save-mapping mapping.json --stats --diff --fail-on-unsafe -v

      - name: CLI smoke test (deanonymize roundtrip)
        shell: bash
        run: |
          python -m soc_log_anonymizer deanonymize \
            -i clean.log -o restored.log --mapping mapping.json
          # Windows checkout may use CRLF while restored.log is LF — compare normalized text.
          python -c "from pathlib import Path; a=Path('examples/sample.log').read_text(encoding='utf-8').replace('\r\n','\n'); b=Path('restored.log').read_text(encoding='utf-8').replace('\r\n','\n'); raise SystemExit(0 if a==b else 'roundtrip mismatch')"

      - name: CLI smoke test (batch)
        shell: bash
        run: |
          mkdir -p logs_in && cp examples/sample.log logs_in/a.log
          python -m soc_log_anonymizer batch \
            --input-dir logs_in --output-dir logs_out \
            --salt-file salt.txt --stats

  gzip-and-stream:
    name: gzip / mmap / stream smoke test (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build gzip fixture and run all stream modes
        run: |
          echo "gzip-smoke-salt-0123456789abcdef" > salt.txt
          gzip -k examples/sample.log -c > sample.log.gz
          python -m soc_log_anonymizer anonymize -i sample.log.gz --salt-file salt.txt -o out1.log --stats
          python -m soc_log_anonymizer anonymize -i sample.log.gz --salt-file salt.txt --stream -o out2.log
          python -m soc_log_anonymizer anonymize -i examples/sample.log --salt-file salt.txt --stream --mmap -o out3.log

  zipapp:
    name: zipapp packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zipapp
        run: |
          mkdir -p build
          cp -r soc_log_anonymizer build/
          python -m zipapp build -m "soc_log_anonymizer.__main__:main" -o anonymizer.pyz
      - name: Smoke test zipapp
        run: |
          python anonymizer.pyz --version
          python anonymizer.pyz validate-config examples/sample_config.json
          echo "zipapp-smoke-salt-0123456789ab" > salt.txt
          python anonymizer.pyz anonymize -i examples/sample.log --salt-file salt.txt --stats

  pyinstaller-build:
    name: PyInstaller build smoke test (GUI, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tkinter + PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller
      - name: Build standalone GUI binary (onefile)
        run: pyinstaller packaging/soc_log_anonymizer_gui_onefile.spec
      - name: Verify binary exists and is executable
        run: |
          test -f dist/soc-log-anonymizer-gui
          test -x dist/soc-log-anonymizer-gui
          ls -la dist/

  pyinstaller-windows:
    name: PyInstaller Windows artifacts (GUI + CLI)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build GUI + CLI (onefile)
        shell: cmd
        run: packaging\build_windows.bat
      - name: Verify executables
        shell: pwsh
        run: |
          Test-Path dist/soc-log-anonymizer-gui.exe | Should -Be $true
          Test-Path dist/soc-log-anonymizer-cli.exe | Should -Be $true
          & dist/soc-log-anonymizer-cli.exe --version
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: soc-log-anonymizer-gui-windows
          path: |
            dist/soc-log-anonymizer-gui.exe
            dist/soc_log_anonymizer.json
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: soc-log-anonymizer-cli-windows
          path: |
            dist/soc-log-anonymizer-cli.exe
            dist/soc_log_anonymizer.json

  pip-install:
    name: pip install -e . smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run installed console script
        run: |
          soc-log-anonymizer --version
          soc-log-anonymizer validate-config examples/sample_config.json

  macos:
    name: Tests (macos-latest, Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  benchmark:
    name: Benchmark smoke (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark unit + timed corpus
        run: |
          python -m unittest tests.test_quality.TestBenchmarkSmoke -v
          python - <<'PY'
          import time, json
          from soc_log_anonymizer import SOCLogAnonymizer
          from soc_log_anonymizer.config import AnonymizerConfig
          a = SOCLogAnonymizer(salt="bench-salt", config=AnonymizerConfig(pbkdf2_iterations=1000))
          line = "sshd: Accepted password for alice from 10.0.0.5 port 22\n"
          payload = line * 20000
          t0 = time.perf_counter()
          out = a.anonymize_text(payload)
          elapsed = time.perf_counter() - t0
          assert "10.0.0.5" not in out
          print(json.dumps({"lines": 20000, "seconds": round(elapsed, 3)}))
          if elapsed > 30:
              raise SystemExit(f"benchmark regression: {elapsed:.2f}s")
          PY
